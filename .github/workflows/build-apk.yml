name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Configure SDK location
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NotifAlarm-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: NotifAlarm-debug-${{ github.run_number }}
          path: release

      - name: Prepare release assets
        working-directory: release
        run: |
          mv app-debug.apk NotifAlarm-debug.apk
          sha256sum NotifAlarm-debug.apk > SHA256SUMS.txt

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Download `NotifAlarm-debug.apk` below to install the app.
          `SHA256SUMS.txt` contains the APK's SHA-256 checksum.

          This is a debug-signed test build, not a store-signed release build.
          The signing key can change between builds. Installing it may require
          uninstalling an existing version first, which removes its app data.
          EOF

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release/NotifAlarm-debug.apk release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              release/NotifAlarm-debug.apk release/SHA256SUMS.txt \
              --verify-tag --title "NotifAlarm $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
